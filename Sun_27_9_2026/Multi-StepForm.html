<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 18 - Multi Step Form</title>
</head>

<body>

    <h1>Registration Form</h1>

    <div id="exercise18-step1">

        <h2>Step 1: Personal Information</h2>

        <label>Name:</label>
        <input type="text" id="exercise18-name">

        <br><br>

        <label>Email:</label>
        <input type="email" id="exercise18-email">

        <br><br>

        <button id="exercise18-next1">Next</button>

    </div>


    <div id="exercise18-step2">

        <h2>Step 2: Educational Information</h2>

        <label>University:</label>
        <input type="text" id="exercise18-university">

        <br><br>

        <label>Major:</label>
        <input type="text" id="exercise18-major">

        <br><br>

        <button id="exercise18-back2">Back</button>
        <button id="exercise18-next2">Next</button>

    </div>


    <div id="exercise18-step3">

        <h2>Step 3: Review and Confirm</h2>

        <div id="exercise18-review"></div>

        <br>

        <button id="exercise18-back3">Back</button>
        <button id="exercise18-confirm">Confirm</button>

    </div>


    <script src="./exercise18.js"></script>

</body>
</html>
